<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyTrade — Messages</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="../Marketplace%20After%20Get%20Started/index.html" aria-label="EasyTrade home">
    <img src="assets/logo.png" alt="EasyTrade">
  </a>

  <label class="global-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    <input type="text" placeholder="Search products..." aria-label="Search products">
  </label>

  <nav class="top-nav">
    <a href="../Marketplace%20After%20Get%20Started/index.html">Marketplace</a>
    <a href="index.html" class="active">Messages</a>
  </nav>

  <div class="role-toggle" role="group" aria-label="Account role">
    <button type="button" class="active">Buyer</button>
    <button type="button">Supplier</button>
  </div>

  <button class="icon-btn" title="Favorites" aria-label="Favorites">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
  </button>
  <button class="icon-btn" title="Notifications" aria-label="Notifications">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
  </button>
  <button class="user-avatar" aria-label="Your account"></button>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-head">
      <h1>Messages</h1>
      <button class="compose-btn" id="composeBtn" title="New message" aria-label="New message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
      </button>
    </div>

    <label class="conv-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input type="text" id="convSearch" placeholder="Search conversations..." aria-label="Search conversations">
    </label>

    <ul class="conv-list" id="convList"></ul>
  </aside>

  <main class="chat">
    <header class="chat-head">
      <img id="chatAvatar" src="assets/avatar-organic-header.png" alt="">
      <div class="chat-id">
        <h2 id="chatName">Organic Harvest Importers</h2>
        <span class="presence" id="chatPresence"><i></i>Active now</span>
      </div>
      <button class="icon-btn kebab" title="Conversation options" aria-label="Conversation options">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
    </header>

    <div class="product-bar" id="productBar">
      <span class="label">Product:</span>
      <button class="product-chip" id="productChip">
        <img id="productImg" src="assets/product-avocado.png" alt="">
        <span id="productLabel">Premium Grade Avocados (Hass)</span>
      </button>
    </div>

    <div class="messages" id="messages"></div>

    <footer class="composer">
      <div class="composer-box">
        <button class="icon-btn small" title="Attach file" aria-label="Attach file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.2-9.19a4 4 0 0 1 5.65 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.49-8.48"/></svg>
        </button>
        <button class="icon-btn small" title="Attach image" aria-label="Attach image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </button>
        <input type="text" id="msgInput" placeholder="Type your message..." aria-label="Type your message">
        <button class="send-btn" id="sendBtn">
          Send
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 4l14 8-14 8V4z"/></svg>
        </button>
      </div>
    </footer>
  </main>
</div>

<script src="script.js"></script>
<script src="../../easytrade-routes.js" defer></script>
</body>
</html>
