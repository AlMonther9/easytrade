<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <article class="product-card">
    <div class="card-media">
      <img class="product-image" src="assets/product.png" alt="Pro-Audio Wireless Studio Headphones">
      <span class="badge badge-wholesale">WHOLESALE</span>
      <button class="favorite-btn" id="favoriteBtn" type="button" aria-label="Add to favorites" aria-pressed="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
        </svg>
      </button>
    </div>

    <div class="card-body">
      <h2 class="product-title">Pro-Audio Wireless Studio Headphones</h2>

      <div class="price-row">
        <span class="price" id="price">$45.50</span>
        <span class="price-meta">/ unit<br>(Min. 50<br>units)</span>
      </div>

      <hr class="divider">

      <div class="supplier-row">
        <div class="supplier-info">
          <img class="supplier-avatar" src="assets/supplier-avatar.png" alt="TechGlobal Ltd. logo">
          <div class="supplier-text">
            <p class="supplier-name">TechGlobal Ltd.</p>
            <span class="badge badge-verified">VERIFIED</span>
          </div>
        </div>
        <div class="supplier-stats">
          <div class="stat">
            <span class="stat-label">RESPONSE</span>
            <span class="stat-value">RATE</span>
            <span class="stat-highlight">98%</span>
          </div>
          <div class="stat">
            <span class="stat-label">LOCATION</span>
            <span class="stat-value stat-highlight">Cairo</span>
          </div>
        </div>
      </div>

      <button class="contact-btn" id="contactBtn" type="button">Contact Supplier</button>
    </div>
  </article>

  <script src="script.js"></script>
<script src="../../easytrade-routes.js" defer></script>
</body>
</html>
