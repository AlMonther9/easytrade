<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add New Product — B2B Wholesale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="../Marketplace%20After%20Get%20Started/index.html">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
      </span>
      <span class="brand-name">B2B Wholesale</span>
    </a>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Search products..." aria-label="Search products">
    </div>

    <nav class="nav" aria-label="Main">
      <a href="../Supplier%20My%20Products%20Dashboard/index.html">Dashboard</a>
      <a href="../Supplier%20My%20Products%20Dashboard/index.html" class="active" aria-current="page">Products</a>
      <a href="#">Orders</a>
      <a href="../Frame%203/index.html">Inventory</a>
    </nav>

    <button class="icon-btn" type="button" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
    <span class="avatar">JD</span>
  </div>
</header>

<main class="page">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="../Supplier%20My%20Products%20Dashboard/index.html">Products</a>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    <span>Add New Product</span>
  </nav>

  <div class="page-head">
    <h1>Add New Product</h1>
    <a class="back-link" href="../Supplier%20My%20Products%20Dashboard/index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Back to Products
    </a>
  </div>

  <form id="product-form" novalidate>
    <section class="card">
      <header class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M12 11v5"/></svg>
        <h2>Basic Information</h2>
      </header>

      <div class="field">
        <label for="product-name">Product Name</label>
        <input id="product-name" name="name" type="text" placeholder="e.g. Premium Cotton Bedspread" autocomplete="off">
        <p class="error-msg"></p>
      </div>

      <div class="field">
        <label for="category">Category</label>
        <div class="select-wrap">
          <select id="category" name="category">
            <option value="" selected disabled>Select Category</option>
            <option>Textiles &amp; Fabrics</option>
            <option>Home &amp; Kitchen</option>
            <option>Packaging Materials</option>
            <option>Apparel &amp; Accessories</option>
            <option>Industrial Supplies</option>
            <option>Electronics</option>
          </select>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <p class="error-msg"></p>
      </div>

      <div class="field">
        <label for="description">Short Description</label>
        <textarea id="description" name="description" rows="4" placeholder="Briefly describe the product's main features..."></textarea>
      </div>
    </section>

    <section class="card">
      <header class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v8a2 2 0 0 0 2 2h12"/><rect x="7" y="3" width="14" height="10" rx="2"/><circle cx="14" cy="8" r="2"/><path d="M10 8h.01"/><path d="M18 8h.01"/></svg>
        <h2>Pricing &amp; MOQ</h2>
      </header>

      <div class="grid-2">
        <div class="field">
          <label for="price">Price per Unit (EGP)</label>
          <div class="input-prefix">
            <span aria-hidden="true">&pound;</span>
            <input id="price" name="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
          </div>
          <p class="error-msg"></p>
        </div>
        <div class="field">
          <label for="moq">Minimum Order Quantity (MOQ)</label>
          <input id="moq" name="moq" type="number" min="1" step="1" inputmode="numeric" placeholder="e.g. 50">
          <p class="error-msg"></p>
        </div>
      </div>
    </section>

    <section class="card">
      <header class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8h.01"/><path d="M8 12h.01"/><path d="M8 16h.01"/><path d="M12 8h5"/><path d="M12 12h5"/><path d="M12 16h5"/></svg>
        <h2>Product Specifications</h2>
      </header>

      <div class="spec-head" aria-hidden="true">
        <span>Property</span>
        <span class="h-value">Value</span>
        <span></span>
      </div>

      <div id="spec-rows">
        <div class="spec-row" data-preset>
          <input class="input-prop preset" type="text" value="Material" readonly>
          <input class="input-val" type="text" placeholder="e.g. 100% Organic Cotton">
          <button class="row-remove" type="button" aria-label="Remove field" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="spec-row" data-preset>
          <input class="input-prop preset" type="text" value="Packaging" readonly>
          <input class="input-val" type="text" placeholder="e.g. Recycled Box">
          <button class="row-remove" type="button" aria-label="Remove field" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="spec-row" data-preset>
          <input class="input-prop preset" type="text" value="Weight" readonly>
          <input class="input-val" type="text" placeholder="e.g. 1.2 kg">
          <button class="row-remove" type="button" aria-label="Remove field" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </div>

      <button class="add-field" type="button" id="add-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
        Add custom field
      </button>
    </section>

    <section class="card">
      <header class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.5-3.5a2 2 0 0 0-2.8 0L6 20"/></svg>
        <h2>Media</h2>
      </header>

      <div class="media-row">
        <button class="upload-zone" type="button" id="upload-zone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"></path><path d="M12 12v9"></path><path d="m8 16 4-4 4 4"></path></svg>
          <strong>Upload Images</strong>
          <span>SVG, PNG, JPG (max. 5MB)</span>
        </button>
        <input type="file" id="file-input" accept=".svg,.png,.jpg,.jpeg,image/svg+xml,image/png,image/jpeg" multiple="" hidden="">
        <div class="thumbs" id="thumbs"><figure class="thumb"><img src="images/Background (28).png" alt="Premium Cotton Bedspread"><button type="button" class="thumb-remove" aria-label="Remove image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></figure><figure class="thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="4"></circle><path d="M13 20h5a2 2 0 0 0 2-2v-5"></path></svg><button type="button" class="thumb-remove" aria-label="Remove image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></figure></div>
      </div>
    </section>

    <div class="form-actions">
      <button class="btn btn-secondary" type="button" id="save-draft">Save as Draft</button>
      <button class="btn btn-primary" type="submit">Publish Product</button>
    </div>
  </form>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
<script src="../../easytrade-routes.js" defer></script>
</body>
</html>
