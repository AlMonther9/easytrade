<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyTrade — Manage Products</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="../easytrade-sidebar.css">
<link rel="stylesheet" href="../easytrade-page-nav.css">
</head>
<body>


<header class="topbar et-page">
  <div class="topbar-left">
    <a class="brand" href="#">
      <svg viewBox="0 0 40 40" class="brand-logo" aria-hidden="true">
        <g fill="none" stroke="#2b3d58" stroke-width="2.4" stroke-linecap="round">
          <path d="M8 30 L16 20 L23 25 L32 11"/>
          <path d="M12 8 L20 16 M28 6 L24 14"/>
        </g>
        <g fill="#38b6f0">
          <circle cx="16" cy="20" r="3.2"/>
          <circle cx="23" cy="25" r="2.6"/>
          <circle cx="20" cy="16" r="2.4"/>
        </g>
        <g fill="#2b3d58">
          <circle cx="32" cy="11" r="2.6"/>
          <circle cx="12" cy="8" r="2.2"/>
          <circle cx="28" cy="6" r="2"/>
          <circle cx="8" cy="30" r="2.4"/>
        </g>
      </svg>
      <span class="brand-name">EasyTrade</span>
    </a>
    <div class="topbar-search">
      <svg viewBox="0 0 24 24" class="icon"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input type="text" placeholder="Search products...">
    </div>
  </div>
  <nav class="topbar-nav">
    <a href="#" class="nav-link active">Marketplace</a>
    <a href="#" class="nav-link">Messages</a>
    <div class="role-switch" id="roleSwitch">
      <button class="role-btn active" data-role="buyer">Buyer</button>
      <button class="role-btn" data-role="supplier">Supplier</button>
    </div>
    <button class="icon-btn" title="Wishlist" aria-label="Wishlist" data-et="myProductsAlt">
      <svg viewBox="0 0 24 24" class="icon"><path d="M12 20s-7-4.6-9.3-9C1.2 8 2.7 4.8 6 4.4c2-.3 3.5.7 4.4 2 .3.4.9.4 1.2 0 .9-1.3 2.4-2.3 4.4-2 3.3.4 4.8 3.6 3.3 6.6-2.3 4.4-9.3 9-9.3 9z"/></svg>
    </button>
    <button class="icon-btn" title="Notifications">
      <svg viewBox="0 0 24 24" class="icon"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2 6"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
    </button>
    <span class="avatar"></span>
  </nav>
</header>

<div class="layout et-page">
  <aside class="et-sidebar" data-et-rail></aside>

  <main class="content">
    <div class="page-head">
      <h1>Manage<br>Products</h1>
      <div class="page-head-actions">
        <div class="search-field">
          <svg viewBox="0 0 24 24" class="icon"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
          <input type="text" id="productSearch" placeholder="Search internal products...">
        </div>
        <button class="btn-primary" id="addProductBtn">
          <svg viewBox="0 0 24 24" class="icon"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add New Product
        </button>
      </div>
    </div>

    <section class="stats">
      <article class="stat-card">
        <div class="stat-top"><span>Total Products</span><em class="stat-icon stat-blue"><svg viewBox="0 0 24 24" class="icon"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><polyline points="8.5 12.5 11 15 15.5 10"/></svg></em></div>
        <strong id="statTotal">42</strong>
      </article>
      <article class="stat-card">
        <div class="stat-top"><span>Total Inquiries</span><em class="stat-icon stat-orange"><svg viewBox="0 0 24 24" class="icon"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3.5 6.5 12 13 20.5 6.5"/></svg></em></div>
        <strong>156</strong>
      </article>
      <article class="stat-card">
        <div class="stat-top"><span>Active Listings</span><em class="stat-icon stat-green"><svg viewBox="0 0 24 24" class="icon"><circle cx="12" cy="12" r="9"/><polyline points="8 12.2 11 15 16.5 9"/></svg></em></div>
        <strong id="statActive">38</strong>
      </article>
    </section>

    <nav class="et-chipbar" aria-label="Product screens">
      <a class="et-link et-link--ghost" href="../Supplier My Products Dashboard/index.html" data-et="myProducts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="12" x2="5" y2="12"></line><polyline points="11 6 5 12 11 18"></polyline></svg>
        My Products
      </a>
      <a class="et-link" href="../Frame 3/index.html" data-et="myProductsAlt">
        Inventory List
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="19" y2="12"></line><polyline points="13 6 19 12 13 18"></polyline></svg>
      </a>
    </nav>

    <section class="table-card">
      <table class="products-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock Status</th>
            <th class="th-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="productsBody"></tbody>
      </table>
      <div class="table-footer">
        <span id="showingText">Showing 4 of 42 products</span>
        <div class="pager">
          <button id="prevPage" class="pager-btn">Previous</button>
          <button id="nextPage" class="pager-btn">Next</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Add New Product</h2>
    <form id="productForm">
      <label>Name <input type="text" id="fName" required></label>
      <label>Category
        <select id="fCategory">
          <option>Hardware &amp; Tools</option>
          <option>Textiles</option>
          <option>Electronics</option>
          <option>Kitchenware</option>
        </select>
      </label>
      <label>Price <input type="text" id="fPrice" placeholder="$5.25" required></label>
      <label>Stock Status
        <select id="fStatus">
          <option value="in">In Stock</option>
          <option value="out">Out of Stock</option>
          <option value="draft">Draft</option>
        </select>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelModal">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="../easytrade-sidebar.js"></script>
<script src="script.js"></script>
<script src="../../easytrade-routes.js" defer></script>
</body>
</html>
