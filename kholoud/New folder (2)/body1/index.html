<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Select a Product</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

    <header class="modal__head">
      <div>
        <h2 class="modal__title" id="modalTitle">Select a Product</h2>
        <p class="modal__step">Step 1: Choose the item to pin to the top of its category.</p>
      </div>
      <button class="modal__close" id="closeBtn" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div class="modal__body">
      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input class="search__input" id="searchInput" type="text" placeholder="Search active inventory..." autocomplete="off" />
      </div>

      <ul class="products" id="products"></ul>

      <p class="empty" id="empty" hidden>No products match your search.</p>
    </div>

    <footer class="modal__foot">
      <div class="deal">
        <div class="deal__cell">
          <span class="deal__label">Hot Deal Price</span>
          <span class="deal__value">EGP <b id="price">250</b> <i>/ week</i></span>
        </div>
        <div class="deal__sep"></div>
        <div class="deal__cell deal__cell--right">
          <span class="deal__label">Duration</span>
          <span class="deal__value"><b id="duration">7</b> days</span>
        </div>
      </div>

      <button class="cta" id="continueBtn" type="button" disabled>
        Continue to Boost Details
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12h14m0 0l-5-5m5 5l-5 5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </footer>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
