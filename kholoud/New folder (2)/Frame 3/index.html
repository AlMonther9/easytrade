<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyTrade — My Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../easytrade-sidebar.css">
  <link rel="stylesheet" href="../easytrade-page-nav.css">
</head>
<body>


  <header class="topbar et-page">
    <div class="topbar-left">
      <a href="#" class="brand"><img src="assets/logo.png" alt="EasyTrade"></a>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Search products...">
      </label>
    </div>
    <nav class="topbar-right">
      <a href="../Marketplace%20After%20Get%20Started/index.html" class="topnav-link active">Marketplace</a>
      <a href="../B2B%20Negotiation%20Inbox/index.html" class="topnav-link">Messages</a>
      <div class="role-toggle">
        <button type="button" class="role-option active">Buyer</button>
        <button type="button" class="role-option">Supplier</button>
      </div>
      <button type="button" class="icon-btn" aria-label="Favorites" data-et="manageProducts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      </button>
      <button type="button" class="icon-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <div class="avatar avatar-lg" aria-label="Account"></div>
    </nav>
  </header>

  <div class="layout et-page">
    <aside class="et-sidebar" data-et-rail></aside>

    <main class="content">
      <div class="page-head">
        <div>
          <h1 id="pageTitle">Inventory List (12 Products)</h1>
          <p class="page-sub">Manage your product catalog and availability.</p>
        </div>
        <button data-et="add-product" type="button" id="addProductBtn" class="btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Add New Product</span>
        </button>
      </div>

      <nav class="et-chipbar" aria-label="Product screens">
        <a class="et-link et-link--ghost" href="../easytrade-products/index.html" data-et="manageProducts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="12" x2="5" y2="12"></line><polyline points="11 6 5 12 11 18"></polyline></svg>
          Manage Products
        </a>
        <a class="et-link et-link--ghost" href="../Supplier My Products Dashboard/index.html" data-et="myProducts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="12" x2="5" y2="12"></line><polyline points="11 6 5 12 11 18"></polyline></svg>
          My Products
        </a>
      </nav>

      <section class="card">
        <table class="inventory-table">
          <thead>
            <tr>
              <th class="col-image">Image</th>
              <th class="col-details">Product Details</th>
              <th class="col-price">Price</th>
              <th class="col-stock">Stock</th>
              <th class="col-status">Status</th>
              <th class="col-actions">Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>

        <div class="table-footer">
          <span id="showingText" class="showing-text">Showing 1 to 4 of 12 products</span>
          <div id="pager" class="pager"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <form class="modal" id="productForm">
      <div class="modal-head">
        <h2 id="modalTitle">Add New Product</h2>
        <button type="button" class="icon-btn" id="modalClose" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>Product Name</span>
          <input type="text" id="fieldName" required maxlength="60">
        </label>
        <label class="field">
          <span>SKU</span>
          <input type="text" id="fieldSku" required maxlength="20">
        </label>
        <div class="field-row">
          <label class="field">
            <span>Price (EGP)</span>
            <input type="number" id="fieldPrice" min="0" step="1" required>
          </label>
          <label class="field">
            <span>Stock (units)</span>
            <input type="number" id="fieldStock" min="0" step="1" required>
          </label>
        </div>
        <label class="field">
          <span>Status</span>
          <select id="fieldStatus">
            <option value="Published">Published</option>
            <option value="Draft">Draft</option>
            <option value="Out of Stock">Out of Stock</option>
          </select>
        </label>
        <label class="field">
          <span>Thumbnail</span>
          <select id="fieldImage">
            <option value="assets/product-blue-1.png">Blue (light)</option>
            <option value="assets/product-blue-2.png">Blue</option>
            <option value="assets/product-gray.png">Gray</option>
            <option value="assets/product-yellow.png">Yellow</option>
          </select>
        </label>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn-ghost" id="modalCancel">Cancel</button>
        <button type="submit" class="btn-primary">Save Product</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status"></div>

<script src="../easytrade-sidebar.js"></script>
  <script src="script.js"></script>
<script src="../../easytrade-routes.js" defer></script>
</body>
</html>
